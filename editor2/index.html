<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<title>framework.dll 控制页</title>
<style>
 body{font:14px/1.5 system-ui;margin:16px}
 button{margin:2px}
 #log{white-space:pre-wrap;background:#111;color:#0f0;padding:8px;height:260px;overflow:auto}
 input{width:64px}
 .row{margin:6px 0}
 #geo{color:#036}
</style>
</head>
<body>
<h3>framework.dll 控制页</h3>

<div class="row">
  <button onclick="send({type:'geometry'})">查询视窗几何</button>
  <span id="geo">-</span>
</div>

<div class="row">
  坐标空间：
  <select id="space"><option value="view">view</option><option value="screen">screen</option></select>
  按钮：
  <select id="btn"><option value="left">left</option><option value="right">right</option><option value="middle">middle</option></select>
</div>

<div class="row">
  相对移动：
  <button onclick="send({type:'mouse',action:'move',dx:100,dy:0})">右100</button>
  <button onclick="send({type:'mouse',action:'move',dx:-100,dy:0})">左100</button>
  <button onclick="send({type:'mouse',action:'move',dx:0,dy:100})">下100</button>
  <button onclick="send({type:'mouse',action:'move',dx:0,dy:-100})">上100</button>
</div>

<div class="row">
  坐标：<input id="x" value="400"><input id="y" value="300">
  <button onclick="send({type:'mouse',action:'moveTo',space:sp(),x:X(),y:Y()})">移动到 (x,y)</button>
  <button onclick="send({type:'mouse',action:'click',space:sp(),x:X(),y:Y(),button:btn()})">点击 (x,y)</button>
  <button onclick="send({type:'mouse',action:'click',button:btn()})">当前位置点击</button>
  <button onclick="send({type:'mouse',action:'down',space:sp(),x:X(),y:Y(),button:btn()})">按下</button>
  <button onclick="send({type:'mouse',action:'up',button:btn()})">抬起</button>
</div>

<div class="row">
  滚轮：
  <button onclick="send({type:'mouse',action:'scroll',delta:120})">上滚</button>
  <button onclick="send({type:'mouse',action:'scroll',delta:-120})">下滚</button>
  <button onclick="send({type:'mouse',action:'scroll',delta:600})">上滚x5</button>
  <button onclick="send({type:'mouse',action:'scroll',delta:-600})">下滚x5</button>
</div>

<div class="row">
  文本：<input id="text" style="width:220px" value="hello 你好">
  <button onclick="send({type:'text', text:$('text').value})">输入文本</button>
</div>

<div class="row">
  <label><input type="checkbox" id="kbd" onchange="toggleKbd()"> 键盘捕获</label>
  <button onclick="send({type:'key',vk:13})">Enter</button>
  <button onclick="send({type:'key',vk:27})">Esc</button>
  <button onclick="send({type:'delay',ms:500})">等待 500ms</button>
</div>

<div class="row"><button onclick="connect()">重连</button> <span id="state">未连接</span></div>
<div id="log"></div>

<script>
let ws, seq = 0;
const $ = id => document.getElementById(id);
function X(){ return +$('x').value; }
function Y(){ return +$('y').value; }
function sp(){ return $('space').value; }
function btn(){ return $('btn').value; }

function log(s){ const el=$('log'); el.textContent+=s+'\n'; el.scrollTop=el.scrollHeight; }

function connect(){
  ws = new WebSocket('ws://127.0.0.1:47801/ws');
  ws.onopen  = () => { $('state').textContent='已连接'; log('[open]'); };
  ws.onclose = () => { $('state').textContent='已断开'; log('[close]'); };
  ws.onerror = () => log('[error]');
  ws.onmessage = e => {
    let s = e.data;
    try {
      const o = JSON.parse(e.data);
      if (o.success && o.data && typeof o.data === 'object' && 'scale' in o.data) {
        $('geo').textContent =
          `x=${o.data.x} y=${o.data.y} w=${o.data.w} h=${o.data.h} scale=${o.data.scale}`;
      }
      s = JSON.stringify(o, null, 1);
    } catch(_) {}
    log('[recv] ' + s);
  };
}

function send(obj){
  if (!ws || ws.readyState !== 1) { log('[warn] 未连接，先点重连'); return; }
  if (obj.id === undefined) obj.id = String(++seq);
  const j = JSON.stringify(obj);
  ws.send(j);
  log('[send] ' + j);
}

function toggleKbd(){
  if ($('kbd').checked) { log('[kbd] 捕获已开'); window.addEventListener('keydown', onKey); }
  else { log('[kbd] 捕获已关'); window.removeEventListener('keydown', onKey); }
}

function onKey(e){
  // e.keyCode 在主流浏览器里仍是 Windows 虚拟键码（A=65、Enter=13…）
  const vk = e.keyCode || 0;
  if (vk > 0 && vk < 256) { send({type:'key', vk}); e.preventDefault(); }
}

connect();
</script>
</body>
</html>
